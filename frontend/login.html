<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shortly — Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <div class="inner-wrap">
          <a class="inner-link brand" href="/login">Shortly</a>
          <nav class="inner-links" aria-label="Chính">
            <a class="inner-link" href="/playground">Playground</a>
          </nav>
        </div>
      </div>
    </header>
    <!-- End Header -->

    <!-- Section Auth -->
    <div class="section-auth">
      <div class="container">
        <div class="inner-wrap">
          <div class="inner-left">
            <p class="inner-tag">URL Shortener</p>
            <h1 class="inner-title-main">Shortly</h1>
            <p class="inner-desc">
              Đăng nhập để gắn short link với tài khoản. Lần đầu dùng Google sẽ
              tự tạo tài khoản mới.
            </p>
          </div>

          <div class="inner-right">
            <div class="inner-item filled-card" id="auth-panel">
              <div class="inner-links tabs" role="tablist">
                <button
                  type="button"
                  class="inner-link tab active"
                  role="tab"
                  aria-selected="true"
                  data-mode="login"
                >
                  Đăng nhập
                </button>
                <button
                  type="button"
                  class="inner-link tab"
                  role="tab"
                  aria-selected="false"
                  data-mode="register"
                >
                  Đăng ký
                </button>
              </div>

              <h2 class="inner-title" id="auth-heading">Đăng nhập</h2>
              <p class="inner-desc" id="auth-blurb">
                Tiếp tục với Google để vào phiên làm việc hiện có.
              </p>

              <a class="inner-submit-btn google-btn" href="/auth/google">
                <img
                  src="/assets/images/google.svg"
                  alt=""
                  width="22"
                  height="22"
                />
                <span id="google-btn-label">Tiếp tục với Google</span>
              </a>

              <p class="inner-desc hint" id="auth-hint" hidden></p>
            </div>

            <div class="inner-item border-card" id="session-panel" hidden>
              <p class="inner-tag">Đã đăng nhập</p>
              <div class="inner-wrap session-row">
                <img
                  class="inner-avatar"
                  id="user-avatar"
                  src=""
                  alt=""
                  width="48"
                  height="48"
                  hidden
                />
                <div>
                  <h2 class="inner-title" id="user-name">—</h2>
                  <p class="inner-desc" id="user-email">—</p>
                </div>
              </div>
              <button
                type="button"
                class="inner-submit-btn ghost"
                id="logout-btn"
              >
                Đăng xuất
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- End Section Auth -->

    <script src="/login.js"></script>
  </body>
</html>
