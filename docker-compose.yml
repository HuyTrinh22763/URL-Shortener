services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_shortener
    volumes:
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  kafka:
    image: bitnamilegacy/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # host → localhost:9092 ; containers → kafka:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
  api:
    profiles: ["full"]
    build: .
    ports:
      - "${PORT:-6001}:${PORT:-6001}"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - mysql
      - redis
      - kafka
  consumer:
    profiles: ["full"]
    build: .
    command: ["node", "backend/consumers/clickConsumer.js"]
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - mysql
      - kafka
